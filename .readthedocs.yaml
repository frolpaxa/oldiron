version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Docs build clean today; keep it that way rather than publishing silently broken pages.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - rich
    - requirements: docs/requirements.txt
